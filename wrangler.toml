name = "ozb-textback"
main = "src/index.js"
compatibility_date = "2026-09-01"

# One Zero Backspace's account. Pinned so a deploy that somehow runs on the
# machine's OAuth login (DeMonte's account) fails instead of landing there.
account_id = "50052194bb5c705c0010e0e2067eff8c"

# Twilio has to reach this, so it is NOT behind Cloudflare Access. Every
# webhook is checked against X-Twilio-Signature instead (src/twilio.js), the
# admin endpoints need ADMIN_SECRET, and a voicemail link needs its signature.
# No workers.dev address or preview URLs: the signature check signs
# PUBLIC_ORIGIN, so only this hostname is meant to be used.
routes = [{ pattern = "textback.onezerobackspace.com", custom_domain = true }]
workers_dev = false
preview_urls = false

[vars]
# What Twilio is told to call, and what X-Twilio-Signature is checked against.
PUBLIC_ORIGIN = "https://textback.onezerobackspace.com"
# The voice that reads the greeting (Twilio <Say>). Amazon Polly voices may
# carry a small per-character charge on Twilio; check the current price.
SAY_VOICE     = "Polly.Joanna"
# The $39/month plan's allowance, per client per month (Eastern time).
# Reported by /admin/usage; nothing is cut off when a client goes over.
PLAN_TEXTS    = "300"
PLAN_MINUTES  = "60"

# Secrets, never in this file (set from ../.env and the Twilio Console):
#   npx wrangler secret put TWILIO_ACCOUNT_SID    --env-file ../.env   # OZB's main account (AC...)
#   npx wrangler secret put TWILIO_API_KEY_SID    --env-file ../.env   # SK..., the key every REST call uses
#   npx wrangler secret put TWILIO_API_KEY_SECRET --env-file ../.env
#   npx wrangler secret put TWILIO_AUTH_TOKEN     --env-file ../.env   # main account's auth token: checks webhook signatures
#   npx wrangler secret put ADMIN_SECRET          --env-file ../.env   # x-admin-secret on /admin/*
#   npx wrangler secret put VM_LINK_KEY           --env-file ../.env   # signs the 7-day voicemail links
# One more per client on its own subaccount, named after the subaccount:
#   npx wrangler secret put TWILIO_AUTH_TOKEN_AC0123... --env-file ../.env

[[d1_databases]]
binding        = "DB"
database_name  = "ozb_textback"
# Placeholder. Creating the database is a deploy step:
#   npx wrangler d1 create ozb_textback --env-file ../.env
# then paste the id it prints here.
database_id    = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Daily at 07:15 UTC: delete calls and texts older than 90 days, and their
# Twilio recordings (src/retention.js). Opt-outs are kept.
[triggers]
crons = ["15 7 * * *"]
