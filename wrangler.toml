name = "ozb-textback"
main = "src/index.js"
compatibility_date = "2026-09-01"

# One Zero Backspace's account. Pinned so a deploy that somehow runs on the
# machine's OAuth login (DeMonte's account) fails instead of landing there.
account_id = "50052194bb5c705c0010e0e2067eff8c"

# Twilio has to reach this, so it is NOT behind Cloudflare Access. Every
# webhook is checked against X-Twilio-Signature instead (src/twilio.js), the
# admin endpoints need ADMIN_SECRET, and a voicemail link needs its signature.
# No workers.dev address or preview URLs: the signature check signs
# PUBLIC_ORIGIN, so only this hostname is meant to be used.
routes = [{ pattern = "textback.onezerobackspace.com", custom_domain = true }]
workers_dev = false
preview_urls = false

[vars]
# What Twilio is told to call, and what X-Twilio-Signature is checked against.
PUBLIC_ORIGIN = "https://textback.onezerobackspace.com"
# The voice that reads the greeting and every other spoken line (Twilio <Say>).
# Ryan picked Google's Chirp 3 HD "Aoede" from a sampler call on 2026-10-24
# (src/voice.js voiceSampler, run by setting VOICE_SAMPLER). Premium voices may
# carry a small per-character charge on Twilio; check the current price.
SAY_VOICE     = "Google.en-US-Chirp3-HD-Aoede"
# The $39/month plan's allowance, per client per month (Eastern time).
# Reported by /admin/usage; nothing is cut off when a client goes over.
PLAN_TEXTS    = "300"
PLAN_MINUTES  = "60"
# Voicemail emails to each client's owner_email (src/notify.js). Must be one
# of the send_email binding's allowed_sender_addresses below.
MAIL_FROM      = "ryan@onezerobackspace.com"
MAIL_FROM_NAME = "OZB Text-back"
# Spending alarms (src/spend.js, scripts/usage-triggers.mjs): Ryan is emailed
# at SPEND_ALERT_AT dollars of Twilio spend in a month on a client's account,
# and texting to callers pauses at SPEND_PAUSE_AT.
ALERT_TO       = "support@tinyblock.net"
SPEND_ALERT_AT = "15"
SPEND_PAUSE_AT = "40"

# Email to owners, the same binding the CRM uses. Voicemails are emailed as
# well as texted, so they reach the owner while the toll-free number is still
# unverified (texts fail with 30032 until then).
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["ryan@onezerobackspace.com"]

# Secrets, never in this file. TWILIO_ACCOUNT_SID, TWILIO_API_KEY_SID,
# TWILIO_API_KEY_SECRET and TWILIO_AUTH_TOKEN are in ../.env; ADMIN_SECRET and
# VM_LINK_KEY are new random values. `wrangler secret put NAME` never reads the
# value from .env: --env-file only supplies the Cloudflare login, and the value
# comes from stdin (or a prompt). README step 5 pipes each one in without
# showing it. One more per client on its own subaccount:
#   TWILIO_AUTH_TOKEN_<subaccount SID>   that subaccount's auth token

[[d1_databases]]
binding        = "DB"
database_name  = "ozb_textback"
# Created 2026-10-24 with `npm run db:create`.
database_id    = "03533078-defd-4924-9a27-02d02129b88d"
migrations_dir = "migrations"

# Daily at 07:15 UTC: delete calls and texts older than 90 days, and their
# Twilio recordings (src/retention.js). Opt-outs are kept.
[triggers]
crons = ["15 7 * * *"]
